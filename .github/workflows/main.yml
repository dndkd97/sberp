name: Deploy Fullstack App

on:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: back/bootSBerp

      - name: Build Spring Boot App
        run: ./gradlew clean build -x test
        working-directory: back/bootSBerp

      - name: Debug Backend Files
        run: |
          echo "=== build/libs 디렉터리 ==="
          ls -al back/bootSBerp/build/libs

      - name: Find JAR file (fat jar만 선택)
        run: echo "JAR_FILE=$(ls back/bootSBerp/build/libs/*.jar | grep -v plain | head -n 1)" >> $GITHUB_ENV

      - name: Ensure JAR exists
        run: |
          if [ ! -f "${{ env.JAR_FILE }}" ]; then
            echo "❌ JAR file not found"
            ls -al back/bootSBerp/build/libs
            exit 1
          fi
          echo "✅ JAR file found: ${{ env.JAR_FILE }}"

      - name: Create Backend .env from Secrets
        run: |
          cat > back/bootSBerp/.env << 'EOF'
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
          NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
          FRONT_URL=${{ secrets.FRONT_URL }}
          WEBHOOK_DISCORD_URL=${{ secrets.WEBHOOK_DISCORD_URL }}
          GOOGLE_EMAIL_HOST=${{ secrets.GOOGLE_EMAIL_HOST }}
          GOOGLE_EMAIL_USER=${{ secrets.GOOGLE_EMAIL_USER }}
          GOOGLE_EMAIL_PASSWORD=${{ secrets.GOOGLE_EMAIL_PASSWORD }}
          GOOGLE_REPORT_CLIENT_ID=${{ secrets.GOOGLE_REPORT_CLIENT_ID }}
          GOOGLE_REPORT_CLIENT_SECRET=${{ secrets.GOOGLE_REPORT_CLIENT_SECRET }}
          GOOGLE_REPORT_REFRESH_TOKEN=${{ secrets.GOOGLE_REPORT_REFRESH_TOKEN }}
          JSJ_OPENAI_API_KEY=${{ secrets.JSJ_OPENAI_API_KEY }}
          JSJ_OPENAI_API_BASEURL=${{ secrets.JSJ_OPENAI_API_BASEURL }}
          JSJ_OPENAI_API_MODEL=${{ secrets.JSJ_OPENAI_API_MODEL }}
          OPENAI_API_BASEURL=${{ secrets.OPENAI_API_BASEURL }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          KJY_OPENAI_API_KEY=${{ secrets.KJY_OPENAI_API_KEY }}
          NTS_BIZNO_API_KEY=${{ secrets.NTS_BIZNO_API_KEY }}
          NAVER_OCR_SECRET=${{ secrets.NAVER_OCR_SECRET }}
          NAVER_OCR_API_URL=${{ secrets.NAVER_OCR_API_URL }}
          NAVER_EMAIL_HOST=${{ secrets.NAVER_EMAIL_HOST }}
          NAVER_EMAIL_USER=${{ secrets.NAVER_EMAIL_USER }}
          NAVER_EMAIL_PASSWORD=${{ secrets.NAVER_EMAIL_PASSWORD }}
          COOLSMS_API_KEY=${{ secrets.COOLSMS_API_KEY }}
          COOLSMS_API_SECRET=${{ secrets.COOLSMS_API_SECRET }}
          COOLSMS_SENDER=${{ secrets.COOLSMS_SENDER }}
          CYJ_OPENAI_API_KEY=${{ secrets.CYJ_OPENAI_API_KEY }}
          CYJ_OPENAI_MODEL=${{ secrets.CYJ_OPENAI_MODEL }}
          EOF

      - name: Ensure app directory exists on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p /home/ubuntu/app/back

      - name: Copy Backend JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "back/bootSBerp/build/libs/*.jar,!back/bootSBerp/build/libs/*-plain.jar"
          target: "/home/ubuntu/app/back"
          strip_components: 3

      - name: Copy Backend .env to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "back/bootSBerp/.env"
          target: "/home/ubuntu/app/back"
          strip_components: 2

      - name: Wait for Oracle & Redis readiness on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "⏳ Waiting for Oracle DB (1521) and Redis (6379)..."
            for i in {1..30}; do
              nc -z localhost 1521 && nc -z localhost 6379
              if [ $? -eq 0 ]; then
                echo "✅ Oracle & Redis are ready"
                break
              fi
              echo "Not ready yet... retry in 10s ($i/30)"
              sleep 10
            done

      - name: Run Backend on EC2 with pm2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app/back
            pm2 delete backend || true
            export $(cat .env | xargs)
            JAR_NAME=$(ls *.jar | grep -v plain | head -n 1)
            pm2 start java --name backend -- -jar "$JAR_NAME"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create Frontend .env.production
        run: |
          echo "NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" > front/.env.production

      - name: Build Frontend
        run: |
          npm install
          npm run build -- --no-lint
        working-directory: front

      - name: Debug Frontend Files
        run: |
          ls -al front
          ls -al front/.next || true

      - name: Ensure front directory exists on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p /home/ubuntu/app/front

      - name: Archive frontend build
        run: |
          cd front
          tar -czf ../frontend-build.tar.gz .next public package.json .env.production

      - name: Copy frontend archive to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend-build.tar.gz"
          target: "/home/ubuntu/app/front"

      - name: Extract archive on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app/front
            rm -rf .next public
            tar -xzf frontend-build.tar.gz

      - name: Run Frontend on EC2 with pm2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app/front
            npm install --production
            pm2 delete frontend || true
            pm2 start npm --name "frontend" -- run start
